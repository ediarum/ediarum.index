# The app's bundle as plain files (ediarum-platform docs/integrating-an-app.md,
# 3.9). The platform's proxy maps /apps/index/ here, prefix stripped; the
# platform itself serves every page — so no index.html and no SPA fallback.
server {
    listen 80;
    root /usr/share/nginx/html;

    # the platform must always get the current version
    location = /embed.js { add_header Cache-Control "no-cache"; }
    # hashed file names
    location /assets/    { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /           { return 404; }
}
