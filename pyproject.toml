[project]
name = "ediarum-index"
version = "0.2.0"
description = "Authority registers (persons, places, works, …) for ediarum projects."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    # ediarum.platform integration: auth (verify + API keys), project registry
    "ediarum-sdk>=0.3,<0.4",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    # export.py / ingest.py parse and build TEI
    "lxml>=6.1.3",
    "pymysql>=1.2.0",
    "sqlmodel>=0.0.42",
    # watch_xml_sources.py: filesystem-change trigger for re-ingest
    "watchdog>=6.0.0",
]

[project.scripts]
ediarum-index = "ediarum_index.cli:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
docs = [
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["ediarum_index"]
omit = ["*/migrations/*", "*/ingest.py"]
