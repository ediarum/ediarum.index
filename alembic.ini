# For writing new revisions only:
#
#   uv run alembic revision --autogenerate -m "…"
#
# The app applies them itself (`ediarum-index migrate`, and on every
# `ediarum-index serve`) — see src/ediarum_index/migrate.py.

[alembic]
script_location = %(here)s/src/ediarum_index/migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
